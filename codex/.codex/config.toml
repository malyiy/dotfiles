# User-level Codex defaults tracked by ~/dotfiles.
# Machine-generated state is intentionally omitted: auth, history, caches,
# generated marketplace paths, app MCP paths, project trust entries,
# TUI nux state, and hook trust hashes.

model = "gpt-5.5"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
default_permissions = ":workspace"
approvals_reviewer = "auto_review"

[features]
js_repl = false

[desktop]
ambient-suggestions-enabled = false
conversationDetailMode = "STEPS_COMMANDS"
keepRemoteControlAwakeWhilePluggedIn = true

[tui]
vim_mode_default = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true
